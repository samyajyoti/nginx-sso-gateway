upstream wrtual_sso_gateway {
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl http2;
    server_name auth.wrtual.in;

    # Configure your TLS certificates here.
    ssl_certificate     /etc/ssl/certs/auth.wrtual.in.crt;
    ssl_certificate_key /etc/ssl/private/auth.wrtual.in.key;

    location / {
        proxy_pass http://wrtual_sso_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
