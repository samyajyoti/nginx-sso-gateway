upstream app_upstream {
    server 127.0.0.1:9000;
}

upstream sso_gateway {
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl http2;
    server_name app1.wrtual.in;

    # Configure your TLS certificates here.
    ssl_certificate     /etc/ssl/certs/app1.wrtual.in.crt;
    ssl_certificate_key /etc/ssl/private/app1.wrtual.in.key;

    location / {
        auth_request /_auth_check;
        auth_request_set $auth_email $upstream_http_x_authenticated_email;
        auth_request_set $auth_user $upstream_http_x_authenticated_user;
        error_page 401 = @login;

        proxy_set_header X-Authenticated-Email $auth_email;
        proxy_set_header X-Authenticated-User $auth_user;
        proxy_pass http://app_upstream;
    }

    location = /_auth_check {
        internal;
        proxy_pass http://sso_gateway/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @login {
        return 302 https://auth.wrtual.in/login?next=$scheme://$host$request_uri;
    }
}
